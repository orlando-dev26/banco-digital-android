spring.application.name=user-microservice
server.port=8092

# Conexión a PostgreSQL usando R2DBC
spring.r2dbc.url=r2dbc:postgresql://host.docker.internal:5432/db_compras
spring.r2dbc.username=postgres
spring.r2dbc.password=95700909

# Pool de conexiones (Reactivo)
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# Mostrar logs SQL (info - menos verboso)
logging.level.org.springframework.r2dbc=INFO

# Health Check
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Circuit Breaker con Resilience4j
resilience4j.circuitbreaker.instances.insertUserCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.insertUserCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.testCircuitBreaker.baseConfig=default
resilience4j.circuitbreaker.instances.testCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=5s
resilience4j.circuitbreaker.configs.default.slowCallRateThreshold=50
resilience4j.circuitbreaker.configs.default.event-consumer-buffer-size=10

logging.level.io.github.resilience4j=WARN
logging.level.org.springframework.aop=WARN

logging.level.org.springframework.web=ERROR
logging.level.reactor.netty=ERROR